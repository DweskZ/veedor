# Veedor production stack. Self-contained: it does NOT extend docker-compose.yml.
#
#   docker compose -p veedor --env-file /etc/veedor/server.env -f compose.prod.yml up -d --wait
#   (add `-f compose.observability.yml` to also run the optional Grafana stack; it is a separate file
#   because compose interpolates every service of a file, so a required GRAFANA_ADMIN_PASSWORD would
#   otherwise break the stack for everyone who does not use Grafana)
#
# Variables come from the env file the owner creates on the server from deploy/server.env.template.
# Nothing secret is stored here. Only Caddy publishes ports; db, api and web are on an internal
# network. See docs/DEPLOYMENT_AWS.md.
#
# Settings mirrored from docker-compose.yml (read on 2026-11-16). If the dev file changes any of
# these, update this file too:
#   - db image pgvector/pgvector:0.8.7-pg16, POSTGRES_USER/DB = veedor, healthcheck pg_isready
#   - api: VEEDOR_DATA_DIR, VEEDOR_DATABASE_URL, VEEDOR_CORS_ORIGINS, VEEDOR_REVIEWS_*,
#     VEEDOR_DOCS_ENABLED, VEEDOR_GLOSSARY_PATH, VEEDOR_API_WORKERS, VEEDOR_LAKE_THREADS,
#     VEEDOR_OTEL_*; mounts of lake/marts/investigations (read-only), dossiers volume;
#     healthcheck on /api/v1/health
#   - web: build args NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL, runtime API_INTERNAL_URL,
#     healthcheck on /
#   - observability (now in compose.observability.yml): grafana/otel-lgtm:0.41.0 and its two provisioning mounts
#   - migrate: `alembic upgrade head` with the api image
#   - settings with no dev-file equivalent (src/veedor/core/settings.py): VEEDOR_ASK_*, VEEDOR_LLM_*

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  VEEDOR_DATA_DIR: /app/data
  VEEDOR_DATABASE_URL: postgresql+psycopg://veedor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server env file}@db:5432/veedor

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    <<: *hardening
    # The entrypoint fixes ownership of PGDATA and then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_USER: veedor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server env file}
      POSTGRES_DB: veedor
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: ${DB_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veedor -d veedor"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    image: ${VEEDOR_API_IMAGE:-veedor-api:release}
    restart: "no"
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    mem_limit: 256m
    logging: *logging

  api:
    image: ${VEEDOR_API_IMAGE:-veedor-api:release}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      VEEDOR_CORS_ORIGINS: '["${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in the server env file}"]'
      # Public deployment: reviews and interactive docs are always off. Not configurable on purpose.
      VEEDOR_REVIEWS_ENABLED: "false"
      VEEDOR_DOCS_ENABLED: "false"
      VEEDOR_GLOSSARY_PATH: /app/web/src/data/glossary.json
      # ONE worker by default (the dev compose uses 2). Measured in the local proof of 2026-11-16 with the
      # 768 MiB limit: two workers start together at about 525-560 MiB and were OOM-killed on the first
      # requests after a start (container OOMKilled=true, "Child process died"); one worker peaked at
      # 390-485 MiB with no kill. Use 2 only with API_MEM_LIMIT=1280m or more (t4g.medium).
      VEEDOR_API_WORKERS: ${VEEDOR_API_WORKERS:-1}
      VEEDOR_LAKE_THREADS: ${VEEDOR_LAKE_THREADS:-2}
      # Client address for the per-IP limiters. The API takes request.client.host, and uvicorn (0.54,
      # --proxy-headers is on by default) rewrites it from X-Forwarded-For ONLY when the TCP peer is in
      # FORWARDED_ALLOW_IPS. "*" trusted every peer and let a forged header win (confirmed by review), so
      # the list is exactly Caddy's fixed address on the pinned network below. Caddy itself discards any
      # client-supplied X-Forwarded-For (deploy/Caddyfile), so the value uvicorn reads is the real peer.
      # web (Next.js server side) also reaches the api but is not trusted: its requests count as web's address.
      FORWARDED_ALLOW_IPS: "10.77.88.10"
      # Third-party quotes: off unless the owner decides otherwise. Do not enable in production until the
      # privacy gate and the disclosure are in place (docs/DEPLOYMENT_AWS.md, pre-publication checklist).
      VEEDOR_QUOTES_ENABLED: ${VEEDOR_QUOTES_ENABLED:-false}
      # Question answering (POST /processes/{ocid}/ask): off unless the owner turns it on. Passed by
      # interpolation only; the values live in the server env file. Needs the optional model cache
      # (see docs/DEPLOYMENT_AWS.md, "Turning on question answering").
      VEEDOR_ASK_ENABLED: ${VEEDOR_ASK_ENABLED:-false}
      VEEDOR_ASK_DAILY_BUDGET: ${VEEDOR_ASK_DAILY_BUDGET:-300}
      VEEDOR_LLM_PROVIDER: ${VEEDOR_LLM_PROVIDER:-}
      VEEDOR_LLM_MODEL: ${VEEDOR_LLM_MODEL:-}
      VEEDOR_LLM_API_KEY: ${VEEDOR_LLM_API_KEY:-}
      # Off unless set (observability profile): http://observability:4318
      VEEDOR_OTEL_ENDPOINT: ${VEEDOR_OTEL_ENDPOINT:-}
      VEEDOR_OTEL_SERVICE_NAME: veedor-api
    volumes:
      - ${VEEDOR_DATA_HOST:-/srv/veedor/data}/lake:/app/data/lake:ro
      - ${VEEDOR_DATA_HOST:-/srv/veedor/data}/marts:/app/data/marts:ro
      - ${VEEDOR_DATA_HOST:-/srv/veedor/data}/investigations:/app/data/investigations:ro
      # Embedding model cache for the ask route only; an empty folder when the route is off.
      - ${VEEDOR_DATA_HOST:-/srv/veedor/data}/models:/app/data/models:ro
      - ${VEEDOR_DATA_HOST:-/srv/veedor/data}/glossary:/app/web/src/data:ro
      - dossiers:/app/data/dossiers
    networks: [internal]
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: ${API_CPUS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  web:
    # Built with NEXT_PUBLIC_API_URL=/api/v1 (same origin): see deploy/scripts/build-release.sh.
    image: ${VEEDOR_WEB_IMAGE:-veedor-web:release}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NODE_OPTIONS: --max-old-space-size=${WEB_HEAP_MB:-192}
    networks: [internal]
    mem_limit: ${WEB_MEM_LIMIT:-320m}
    cpus: ${WEB_CPUS:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      # ":80" = plain HTTP on any host name or IP (temporary mode). A domain name = automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0:80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 10.77.88.10 # fixed: the api trusts X-Forwarded-For from this address only
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *logging

networks:
  # One private network. Only Caddy publishes ports. Egress stays open (ACME for Caddy; an LLM
  # provider for the api when the ask route is on).
  # The subnet is pinned so Caddy can have a fixed address (see FORWARDED_ALLOW_IPS on the api).
  internal:
    ipam:
      config:
        - subnet: 10.77.88.0/24

volumes:
  pgdata:
  dossiers:
  caddy_data:
  caddy_config:
