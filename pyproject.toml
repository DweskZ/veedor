[project]
name = "veedor"
version = "0.1.0"
description = "Open risk radar for public procurement in Ecuador: red-flag indicators, supplier cross-checks and evidence dossiers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.5",
    "langgraph>=1.2.22",
    "langchain>=1.5.0",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-anthropic>=1.7.10",
    "langchain-groq>=1.2.0",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pgvector>=0.5.1",
    "mcp>=2.3.0",
    "fastembed>=0.9.1",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-api>=1.45.2",
]

[project.scripts]
veedor = "veedor.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veedor"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
