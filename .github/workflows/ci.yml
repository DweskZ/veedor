name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: veedor
          POSTGRES_PASSWORD: veedor_dev
          POSTGRES_DB: veedor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U veedor -d veedor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest
