# Local full stack: `docker compose up -d --build`
#   web  http://localhost:3000   api  http://localhost:8000 (docs at /docs)   db  localhost:5433
# Ports are bound to 127.0.0.1 only; put a reverse proxy in front for any other exposure (see
# docs/DEPLOYMENT.md).
# The API never calls an LLM (dossiers served over HTTP are always template mode), so no LLM
# variable is passed to any container. LLM-written dossiers are produced only with the CLI.
# Nothing secret is stored in this file or in the images.
# Observability (docs/OBSERVABILITY.md): Grafana http://localhost:3001 (user admin, password
# ${GRAFANA_ADMIN_PASSWORD:-veedor_dev}; loopback only), OTLP/HTTP 127.0.0.1:4318, Prometheus
# 127.0.0.1:9090, Tempo 127.0.0.1:3200.

x-api-env: &api-env
  VEEDOR_DATA_DIR: /app/data
  VEEDOR_DATABASE_URL: postgresql+psycopg://veedor:${POSTGRES_PASSWORD:-veedor_dev}@db:5432/veedor

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: veedor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veedor_dev}
      POSTGRES_DB: veedor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - veedor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veedor -d veedor"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: veedor-api:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: veedor-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      VEEDOR_CORS_ORIGINS: '["http://localhost:3000"]'
      # Reviews are off unless both are set. The token is a secret: pass it from the environment.
      VEEDOR_REVIEWS_ENABLED: ${VEEDOR_REVIEWS_ENABLED:-false}
      VEEDOR_REVIEWS_TOKEN: ${VEEDOR_REVIEWS_TOKEN:-}
      VEEDOR_DOCS_ENABLED: ${VEEDOR_DOCS_ENABLED:-true}
      # Performance: uvicorn processes and DuckDB threads per process (docs/DEPLOYMENT.md).
      VEEDOR_API_WORKERS: ${VEEDOR_API_WORKERS:-2}
      VEEDOR_LAKE_THREADS: ${VEEDOR_LAKE_THREADS:-2}
      VEEDOR_OTEL_ENDPOINT: http://observability:4318
      VEEDOR_OTEL_SERVICE_NAME: veedor-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The lake and marts are read-only; only generated dossiers and traces are writable.
      - ./data/lake:/app/data/lake:ro
      - ./data/marts:/app/data/marts:ro
      # Stored investigations are produced by the CLI on the host and only read by the API.
      - ./data/investigations:/app/data/investigations:ro
      - veedor_dossiers:/app/data/dossiers
      - veedor_traces:/app/data/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # One all-in-one image: OpenTelemetry Collector + Tempo (traces) + Prometheus (metrics) +
  # Loki + Grafana. Development use only; every port is bound to loopback.
  observability:
    image: grafana/otel-lgtm:0.41.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-veedor_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/veedor/veedor.json
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=7d
      ENABLE_LOGS_TEMPO: "true"
    ports:
      - "127.0.0.1:3001:3000"   # Grafana (3000 is the web app)
      - "127.0.0.1:4318:4318"   # OTLP/HTTP receiver
      - "127.0.0.1:9090:9090"   # Prometheus HTTP API
      - "127.0.0.1:3200:3200"   # Tempo HTTP API
    volumes:
      - veedor_obsdata:/data
      - ./ops/observability/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/veedor.yaml:ro
      - ./ops/observability/grafana/dashboards/veedor.json:/otel-lgtm/grafana/conf/provisioning/dashboards/veedor/veedor.json:ro
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: veedor-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  veedor_pgdata:
  veedor_dossiers:
  veedor_traces:
  veedor_obsdata:
